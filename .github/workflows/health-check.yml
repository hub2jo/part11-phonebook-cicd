name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed app
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://hub2jo-phonebook-cicd.onrender.com/health
          max-attempts: 3
          retry-delay: 30s
